name: Checks and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
        env:
          POSTGRES_DB: divetracx_test
          POSTGRES_USER: divetracx
          POSTGRES_PASSWORD: divetracx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U divetracx -d divetracx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://divetracx:divetracx@localhost:5432/divetracx_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application and chart
        run: bun run verify

      - name: Build public demo
        run: bun run build:demo

      - name: Check generated route tree
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Test import integrations
        run: bun run test:integration:imports

      - name: Validate authenticated Docker Compose deployment
        env:
          HODOR_PASSWORD: ci-password
          HODOR_SECRET: ci-signing-secret
        run: docker compose config --quiet

  image:
    needs: checks
    uses: michidk/workflows/.github/workflows/container-image.yml@2c4ee9b8cfd92fbaea848db9c4c3d92a2ad6e71d # main
    permissions:
      contents: read
      packages: write
    with:
      timeout-minutes: 30
