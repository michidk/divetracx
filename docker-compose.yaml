services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: divetracx
      POSTGRES_USER: divetracx
      POSTGRES_PASSWORD: divetracx
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divetracx -d divetracx"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - divetracx-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://divetracx:divetracx@postgres:5432/divetracx
      STORAGE_PROVIDER: local
      STORAGE_PATH: /uploads
      STORAGE_URL: /media
      # Set these in .env to enable Garmin imports through the bundled adapter
      # (see the garmin-adapter service and .env.example).
      GARMIN_ADAPTER_FULL_IMPORT_URL: ${GARMIN_ADAPTER_FULL_IMPORT_URL:-}
      GARMIN_ADAPTER_INCREMENTAL_IMPORT_URL: ${GARMIN_ADAPTER_INCREMENTAL_IMPORT_URL:-}
      GARMIN_ADAPTER_AUTHORIZATION: ${GARMIN_ADAPTER_AUTHORIZATION:-}
      # OAuth-protected MCP is reached through a path-routing reverse proxy;
      # Hodor's interactive cookie gate is not an MCP authorization server.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-}
      MCP_OAUTH_SCOPE: ${MCP_OAUTH_SCOPE:-divetracx:read}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - divetracx-uploads:/uploads

  garmin-adapter:
    build: .
    profiles: ["garmin"]
    command: ["bun", "run", "scripts/garmin-adapter.ts"]
    restart: unless-stopped
    environment:
      GARMIN_ADAPTER_AUTHORIZATION: ${GARMIN_ADAPTER_AUTHORIZATION:-}
      GARMIN_TOKEN_DIRECTORY: /data/garmin-tokens
      GARMIN_MFA_CHALLENGE_TTL_SECONDS: ${GARMIN_MFA_CHALLENGE_TTL_SECONDS:-300}
    expose:
      - "8787"
    volumes:
      - divetracx-garmin-tokens:/data/garmin-tokens

  hodor:
    image: ${HODOR_IMAGE:-ghcr.io/michidk/hodor@sha256:7cdb5de7ee2c776ee6c2ae049e1b2050caa60288d7b3148e26117a5d6bba18b2}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HODOR_PORT:-3000}:8080"
    environment:
      PASSWORD: ${HODOR_PASSWORD:?Set HODOR_PASSWORD in .env}
      SECRET: ${HODOR_SECRET:?Set HODOR_SECRET in .env}
      UPSTREAM: http://app:3000
      TITLE: ${HODOR_TITLE:-Divetracx Login}
      SESSION_TTL: ${HODOR_SESSION_TTL:-86400}
      SECURE_COOKIE: ${HODOR_SECURE_COOKIE:-false}
      LOG_FORMAT: ${HODOR_LOG_FORMAT:-compact}

volumes:
  divetracx-postgres:
  divetracx-uploads:
  divetracx-garmin-tokens:
