services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: divetracx
      POSTGRES_USER: divetracx
      POSTGRES_PASSWORD: divetracx
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divetracx -d divetracx"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - divetracx-postgres:/var/lib/postgresql/data

volumes:
  divetracx-postgres:
