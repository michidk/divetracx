{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "divetracx.fullname" . }}-mcp
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with .Values.mcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mcp.ingress.className }}
  ingressClassName: {{ .Values.mcp.ingress.className }}
  {{- end }}
  {{- with .Values.mcp.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (required "mcp.ingress.hosts is required when the MCP ingress is enabled" .Values.mcp.ingress.hosts) }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "divetracx.fullname" $ }}-mcp
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource/api/mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "divetracx.fullname" $ }}-mcp
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ include "divetracx.fullname" $ }}-mcp
                port:
                  name: http
    {{- end }}
{{- end }}
