{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "divetracx.fullname" . }}-mcp
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "divetracx.selectorLabels" . | nindent 4 }}
{{- end }}
