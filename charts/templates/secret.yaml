{{- if and .Values.hodor.enabled (not .Values.hodor.existingSecret) }}
{{- $secretName := printf "%s-hodor" (include "divetracx.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $signingSecret := .Values.hodor.secret -}}
{{- if and (empty $signingSecret) $existingSecret $existingSecret.data (hasKey $existingSecret.data "secret") -}}
{{- $signingSecret = (index $existingSecret.data "secret" | b64dec) -}}
{{- end -}}
{{- if empty $signingSecret -}}
{{- $signingSecret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "hodor.password is required when Hodor is enabled" .Values.hodor.password | quote }}
  secret: {{ $signingSecret | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.postgresql.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "divetracx.dbSecretName" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "postgresql.external.url is required when bundled PostgreSQL and postgresql.existingSecret are disabled" .Values.postgresql.external.url | quote }}
{{- end }}
{{- if and .Values.migrations.enabled .Values.migrations.hook.enabled (not .Values.postgresql.enabled) (not .Values.postgresql.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "divetracx.migrationDbSecretName" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  url: {{ required "postgresql.external.url is required when bundled PostgreSQL and postgresql.existingSecret are disabled" .Values.postgresql.external.url | quote }}
{{- end }}
{{- if and .Values.divemate.backupUrl (not .Values.divemate.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "divetracx.divemateSecretName" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.divemate.existingSecretKey }}: {{ .Values.divemate.backupUrl | quote }}
{{- end }}
