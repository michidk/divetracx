{{- if .Values.sync.enabled }}
{{- if or (empty .Values.divemate.googleDriveFolderId) (empty .Values.divemate.existingSecret) }}
{{- fail "sync.enabled requires divemate.googleDriveFolderId and divemate.existingSecret" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "divetracx.fullname" . }}-divemate-sync
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: divemate-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  {{- if .Values.sync.timeZone }}
  timeZone: {{ .Values.sync.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.sync.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.sync.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.sync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ div .Values.imports.timeoutMs 1000 }}
      backoffLimit: {{ .Values.sync.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "divetracx.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: divemate-sync
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync
              image: {{ include "divetracx.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - bun
                - run
                - scripts/sync-divemate.ts
                - --trigger=schedule
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      {{- if .Values.postgresql.existingSecret }}
                      name: {{ .Values.postgresql.existingSecret }}
                      key: {{ .Values.postgresql.existingSecretKey }}
                      {{- else if .Values.postgresql.enabled }}
                      name: {{ include "divetracx.postgresqlSecretName" . }}
                      key: url
                      {{- else }}
                      name: {{ include "divetracx.dbSecretName" . }}
                      key: url
                      {{- end }}
                - name: IMPORT_TIMEOUT_MS
                  value: {{ .Values.imports.timeoutMs | quote }}
                - name: DIVEMATE_GOOGLE_DRIVE_FOLDER_ID
                  value: {{ .Values.divemate.googleDriveFolderId | quote }}
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/run/secrets/divetracx/google-credentials.json
                - name: DIVEMATE_MAX_IMAGE_BYTES
                  value: {{ .Values.divemate.maxImageBytes | quote }}
                - name: DIVEMATE_MAX_BACKUP_BYTES
                  value: {{ .Values.divemate.maxBackupBytes | quote }}
                - name: STORAGE_PROVIDER
                  value: {{ .Values.storage.provider | quote }}
                {{- if eq .Values.storage.provider "local" }}
                - name: STORAGE_PATH
                  value: {{ .Values.storage.local.path | quote }}
                {{- else }}
                - name: S3_BUCKET
                  value: {{ .Values.storage.s3.bucket | quote }}
                - name: S3_REGION
                  value: {{ .Values.storage.s3.region | quote }}
                {{- if .Values.storage.s3.endpoint }}
                - name: S3_ENDPOINT
                  value: {{ .Values.storage.s3.endpoint | quote }}
                {{- end }}
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.storage.s3.existingSecret }}
                      key: {{ .Values.storage.s3.existingSecretAccessKeyIdKey }}
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.storage.s3.existingSecret }}
                      key: {{ .Values.storage.s3.existingSecretSecretAccessKeyKey }}
                {{- end }}
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
                {{- if eq .Values.storage.provider "local" }}
                - name: uploads
                  mountPath: {{ .Values.storage.local.path }}
                {{- end }}
                {{- if .Values.divemate.googleDriveFolderId }}
                - name: google-credentials
                  mountPath: /var/run/secrets/divetracx
                  readOnly: true
                {{- end }}
          volumes:
            - name: temporary
              emptyDir: {}
            {{- if eq .Values.storage.provider "local" }}
            - name: uploads
              persistentVolumeClaim:
                claimName: {{ include "divetracx.fullname" . }}-uploads
            {{- end }}
            {{- if .Values.divemate.googleDriveFolderId }}
            - name: google-credentials
              secret:
                secretName: {{ required "divemate.existingSecret is required for Google Drive" .Values.divemate.existingSecret }}
                items:
                  - key: {{ .Values.divemate.googleCredentialsSecretKey }}
                    path: google-credentials.json
            {{- end }}
{{- end }}
