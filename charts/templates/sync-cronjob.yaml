{{- if .Values.sync.enabled }}
{{- if and (not .Values.divemate.existingSecret) (empty .Values.divemate.backupUrl) }}
{{- fail "sync.enabled requires divemate.existingSecret or divemate.backupUrl" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "divetracx.fullname" . }}-divemate-sync
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: divemate-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  {{- if .Values.sync.timeZone }}
  timeZone: {{ .Values.sync.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.sync.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.sync.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.sync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.sync.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "divetracx.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: divemate-sync
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync
              image: {{ include "divetracx.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - bun
                - run
                - scripts/sync-divemate.ts
                - --trigger=schedule
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      {{- if .Values.postgresql.existingSecret }}
                      name: {{ .Values.postgresql.existingSecret }}
                      key: {{ .Values.postgresql.existingSecretKey }}
                      {{- else if .Values.postgresql.enabled }}
                      name: {{ include "divetracx.postgresqlSecretName" . }}
                      key: url
                      {{- else }}
                      name: {{ include "divetracx.dbSecretName" . }}
                      key: url
                      {{- end }}
                - name: DIVEMATE_BACKUP_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "divetracx.divemateSecretName" . }}
                      key: {{ .Values.divemate.existingSecretKey }}
                - name: DIVEMATE_MAX_BACKUP_BYTES
                  value: {{ .Values.divemate.maxBackupBytes | quote }}
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir: {}
{{- end }}
