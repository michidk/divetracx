{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "divetracx.fullname" . }}-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "divetracx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
