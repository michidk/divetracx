{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "divetracx.fullname" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "divetracx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ ternary 8080 3000 .Values.hodor.enabled }}
        {{- if and .Values.mcp.enabled .Values.hodor.enabled }}
        - protocol: TCP
          port: 3000
        {{- end }}
{{- end }}
