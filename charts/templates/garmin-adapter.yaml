{{- if .Values.garminAdapter.enabled }}
{{- if empty .Values.garmin.existingSecret }}
{{- fail "garminAdapter.enabled requires garmin.existingSecret with the shared authorization value" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "divetracx.garminAdapterName" . }}-tokens
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: garmin-adapter
spec:
  accessModes:
    - {{ .Values.garminAdapter.tokens.accessMode }}
  {{- if .Values.garminAdapter.tokens.storageClass }}
  storageClassName: {{ .Values.garminAdapter.tokens.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.garminAdapter.tokens.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "divetracx.garminAdapterName" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: garmin-adapter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "divetracx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: garmin-adapter
  template:
    metadata:
      labels:
        {{- include "divetracx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: garmin-adapter
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: garmin-adapter
          image: {{ include "divetracx.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bun
            - run
            - scripts/garmin-adapter.ts
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.garminAdapter.port }}
              protocol: TCP
          env:
            - name: GARMIN_ADAPTER_PORT
              value: {{ .Values.garminAdapter.port | quote }}
            - name: GARMIN_TOKEN_DIRECTORY
              value: /data/garmin-tokens
            - name: GARMIN_DOMAIN
              value: {{ .Values.garminAdapter.domain | quote }}
            - name: GARMIN_MFA_CHALLENGE_TTL_SECONDS
              value: {{ .Values.garminAdapter.mfaChallengeTtlSeconds | quote }}
            - name: GARMIN_ADAPTER_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garmin.existingSecret }}
                  key: {{ .Values.garmin.authorizationSecretKey }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.garminAdapter.resources | nindent 12 }}
          volumeMounts:
            - name: tokens
              mountPath: /data/garmin-tokens
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: tokens
          persistentVolumeClaim:
            claimName: {{ include "divetracx.garminAdapterName" . }}-tokens
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "divetracx.garminAdapterName" . }}
  labels:
    {{- include "divetracx.labels" . | nindent 4 }}
    app.kubernetes.io/component: garmin-adapter
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.garminAdapter.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "divetracx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: garmin-adapter
{{- end }}
